<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bio Data Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Bio Data</h1>
        <p>Please fill in your information below.</p>

        <form id="bioForm">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="matricnumber">Matric Number:</label>
            <input type="text" id="matricnumber" name="matricnumber" placeholder="Enter your Matric Number" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="department">Department:</label>
            <input type="text" id="department" name="department" placeholder="Enter your department" required>

            <label for="level">Level:</label>
            <select id="level" name="level" required>
                <option value="">Select your level</option>
                <option value="100 Level">100 Level</option>
                <option value="200 Level">200 Level</option>
                <option value="300 Level">300 Level</option>
                <option value="400 Level">400 Level</option>
                <option value="500 Level">500 Level</option>
            </select>

            <button type="submit">Submit Form</button>

            <p id="message" role="status"></p>

        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
